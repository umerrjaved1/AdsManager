# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process.
# 4g rather than the old 2g: lint's manifest analysis and R8 on the app module both ran out of heap
# below that (the java_pid*.hprof dumps in the repo root are from those runs).
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8

# AndroidX is required by every dependency here.
android.useAndroidX=true

# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official

# Only the resources a module actually declares end up in its R class.
android.nonTransitiveRClass=true

# Publishing credentials are deliberately NOT here. This file is tracked, which is how a GitHub PAT
# ended up committed once already. Put gpr.user / gpr.key in local.properties (gitignored), or set
# GITHUB_USERNAME / GITHUB_TOKEN in the environment - adsManager/build.gradle.kts reads all three,
# local.properties first.
