name: Publish to GitHub Packages

on:
  push:
    tags:
      - 'v*'   # Runs only when you push a version tag like v1.0.1

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v3

      # Runs before publishing so a broken tag fails here rather than shipping an artifact.
      - name: Unit tests
        run: ./gradlew :adsManager:testReleaseUnitTest

      - name: Publish library to GitHub Packages
        env:
          GITHUB_USERNAME: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew clean publish

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: adsManager/build/reports/
          if-no-files-found: ignore